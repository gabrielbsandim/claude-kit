schema_version: "1.0"
name: config-driven-gates
context:
  # Builds a throwaway repo whose gate commands are deliberately unusual, so an
  # answer that names them can only have come from reading the config. A skill
  # that guessed "npm test" fails this case, which is the whole point: every
  # path and command in the funnel has to come from funnel.config.json.
  scaffold_script: scaffold.sh
