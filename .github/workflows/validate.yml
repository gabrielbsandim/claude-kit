name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # --strict fails on an unrecognized field, which is the failure mode that
      # matters here: a typo in a manifest key is silently ignored at runtime and
      # the component just never loads.
      - name: Validate manifests and components
        run: |
          set -e
          for target in . ./.claude-plugin/plugin.json ./skills ./agents ./commands; do
            echo "== $target"
            claude plugin validate "$target" --strict
          done

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dispatch on the shebang rather than the name: bin/ holds both, and
      # `bash -n` on a Python file is a syntax error about the wrong language.
      - name: Syntax, by interpreter
        run: |
          set -e
          for f in bin/*; do
            case "$(head -1 "$f")" in
              *python*) python3 -m py_compile "$f"; echo "py   $f" ;;
              *)        bash -n "$f";              echo "bash $f" ;;
            esac
          done
          for f in hooks/*.py tests/*.py; do python3 -m py_compile "$f"; done

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          for f in bin/*; do
            case "$(head -1 "$f")" in *python*) ;; *) shellcheck -S warning "$f" || true ;; esac
          done

      - name: Hook behaviour
        run: python3 tests/test-hooks.py

      - name: Screen route mapping
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          python3 tests/test-screen-routes.py

      - name: Gate concurrency
        run: python3 tests/test-gate-jobs.py

      - name: Worktree teardown verdicts
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          python3 tests/test-worktree-state.py

      - name: Plugin version staleness
        run: python3 tests/test-kit-version.py

      - name: Issue overlap scoring
        run: python3 tests/test-issues.py

      - name: Plugin freshness hook
        run: python3 tests/test-plugin-freshness.py

      - name: Pull request body budget
        run: python3 tests/test-pr-body.py

      - name: Fan-out routing and the short lane
        run: python3 tests/test-fan-out-routing.py

      - name: Eval suite schema
        run: |
          pip install --quiet pyyaml
          python3 tests/check-eval-schema.py

      - name: Templates are valid JSON
        run: for f in templates/*.json .claude-plugin/*.json; do jq -e . "$f" > /dev/null; done

  no-em-dash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The plugin ships a hook that enforces this, so the plugin's own text has to
      # pass it. Checked with a codepoint, because a file that greps for the literal
      # would match itself.
      - name: No em dash in shipped text
        run: |
          hits=$(grep -rlP '\x{2014}' --include='*.md' --include='*.json' --include='*.py' . bin/* || true)
          if [ -n "$hits" ]; then
            echo "em dash found in:"; echo "$hits"; exit 1
          fi
          echo "clean"
